<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Título, descrição e demais metatags de SEO são preenchidos automaticamente
       a partir de js/config.js (bloco "meta"). Não é necessário editar aqui. -->
  <title>Clínica</title>
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#F2EFE7">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="pular-conteudo" href="#conteudo-principal">Pular para o conteúdo</a>

  <header class="cabecalho" id="cabecalho"></header>

  <main id="conteudo-principal">
    <a id="topo"></a>

    <!-- HERO ------------------------------------------------------------ -->
    <section class="hero" id="hero" aria-label="Apresentação"></section>

    <!-- DIFERENCIAIS ------------------------------------------------------ -->
    <section class="secao secao--alt" id="diferenciais" aria-label="Diferenciais"></section>

    <!-- PROCEDIMENTOS ------------------------------------------------------ -->
    <section class="secao secao--clara" id="procedimentos" aria-label="Procedimentos"></section>

    <!-- DEPOIMENTOS ------------------------------------------------------ -->
    <section class="secao secao--alt" id="avaliacoes" aria-label="Avaliações de pacientes"></section>

    <!-- GALERIA ------------------------------------------------------ -->
    <section class="secao secao--clara" id="galeria" aria-label="Galeria de fotos"></section>

    <!-- SOBRE ------------------------------------------------------ -->
    <section class="secao secao--alt" id="sobre" aria-label="Sobre a clínica"></section>

    <!-- EQUIPE ------------------------------------------------------ -->
    <section class="secao secao--clara" id="equipe" aria-label="Equipe"></section>

    <!-- COMO FUNCIONA (fundo escuro) ------------------------------------------------------ -->
    <section class="secao secao--noturna" id="como-funciona" aria-label="Como funciona o atendimento"></section>

    <!-- FAQ ------------------------------------------------------ -->
    <section class="secao secao--clara" id="faq" aria-label="Perguntas frequentes"></section>

    <!-- LOCALIZAÇÃO ------------------------------------------------------ -->
    <section class="secao secao--alt" id="localizacao" aria-label="Localização e horários"></section>

    <!-- CTA FINAL (fundo escuro) ------------------------------------------------------ -->
    <section class="secao secao--noturna" id="cta-final" aria-label="Agende sua avaliação"></section>
  </main>

  <footer class="rodape" id="rodape"></footer>

  <a id="whatsapp-flutuante" class="whatsapp-flutuante" href="#" aria-label="Conversar no WhatsApp"></a>

  <!-- ORDEM IMPORTA: config.js primeiro (dados), depois script.js (renderiza) -->
  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
